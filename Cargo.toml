[package]
name = "Worldkiln"
version = "1.0.0"
default-run = "Installer"
license-file = "LICENSE"
edition = "2024"

[features]
default = ["editor"]
editor = []
runtime = []
kilngraph = [] # Opt-in external host telemetry

[lib]
name = "Worldkiln"
path = "src/lib.rs"

[[bin]]
name = "Installer"
path = "src/main.rs"
required-features = ["editor"]
test = false # Installer re-declares the library; avoid executing all library tests twice

[[bin]]
name = "aeogame"
path = "src/bin/aeogame.rs"
required-features = ["runtime"]


[[bin]]
name = "gi-query-bench"
path = "src/bin/gi_query_bench.rs"
required-features = ["runtime"]

[dependencies]
# Worldkiln 0.9.1 | WO 0.9.1-01 | 2026-10-05 11:32 -05:00
fastnoise-lite = "1.1.1"
# Worldkiln 0.9.x | WO WK-RENDER-001 | 2026-10-11
# Native Vulkan device/API support for the new geometry renderer.
ash = "0.38.0"
# Worldkiln 0.9.x | WK-RENDER-009: native Vulkan WSI/swapchain on winit windows.
ash-window = "0.13.0"
# Worldkiln 0.9.x | WO WK-RENDER-005 | 2026-10-11
# WGSL shader validation and Vulkan SPIR-V generation without platform shader executables.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }
gl = "0.14.0"
glam = "0.33.7"
# Rigid-body solver backend used for the unified physics migration.
rapier3d = "0.36.1"
# Worldkiln 0.8.7 | WO 0.8.7-33 | 2026-10-07
# Parse validated GLB documents directly; image decoding stays in Worldkiln's
# existing image pipeline instead of gltf's filesystem importer.
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils", "KHR_materials_unlit"] }
glutin = "0.32.3"
glutin-winit = "0.5.0"
winit = "0.30.13"
egui = "0.29.1"
egui_commonmark = { version = "=0.18.0", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
base64 = "0.22"
arboard = { version = "3.6", features = ["image-data"] }
# Worldkiln 0.8.7 | WO 0.8.7-28 | 2026-10-06 12:40 -05:00
egui_code_editor = "=0.2.10"
egui-winit = { version = "0.29.1", default-features = false, features = ["links", "clipboard"] }
egui_glow = "0.29.1"
glow = "0.14.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15.0"
chrono = "0.4"
rand = "0.8"
rodio = "0.20"
# Worldkiln 0.8.7 | WO 0.8.7-52 | 2026-10-09 09:30 -05:00
# Windows-native MP4/H264 decode; no ffmpeg.exe dependency.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
flate2 = "1.1"
rerecast = "=0.4.0"



# Worldkiln 0.8.5 | WO 0.8.7-83 | 2026-10-10 01:08 -05:00
[build-dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Navigation generation is CPU-bound; optimize this dependency in ordinary dev
# builds while keeping the existing checkout and target directory.
[profile.dev.package.rerecast]
opt-level = 3
